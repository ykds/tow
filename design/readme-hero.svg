<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Two 多项目 Agent 终端工作台界面示意</title>
  <desc id="desc">深色桌面窗口中，左侧按项目组织独立终端会话，右侧显示原生终端。界面文字和终端内容为演示。</desc>
  <defs>
    <radialGradient id="glow" cx="75%" cy="18%" r="75%">
      <stop offset="0" stop-color="#30333d"/>
      <stop offset=".58" stop-color="#191c22"/>
      <stop offset="1" stop-color="#101216"/>
    </radialGradient>
    <linearGradient id="warm" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#edbf9d"/>
      <stop offset="1" stop-color="#c88268"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#24272e"/>
      <stop offset="1" stop-color="#1c1f24"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-35%" width="150%" height="190%">
      <feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#000" flood-opacity=".48"/>
    </filter>
    <clipPath id="window-clip"><rect x="92" y="274" width="1416" height="556" rx="19"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#glow)"/>
  <circle cx="1390" cy="60" r="380" fill="#db9b78" opacity=".055"/>
  <path d="M0 753C356 664 682 831 1008 727s473-38 592-20" fill="none" stroke="#e5b391" stroke-opacity=".08" stroke-width="2"/>
  <path d="M0 796C356 707 682 874 1008 770s473-38 592-20" fill="none" stroke="#e5b391" stroke-opacity=".055" stroke-width="2"/>

  <g transform="translate(96 56)">
    <g fill="none" stroke="#e8eceb" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 8h43M26.5 8v40" stroke-width="9"/>
      <path d="m62 22 8 25 11-21 11 21 8-25" stroke-width="8"/>
      <ellipse cx="133" cy="35" rx="13" ry="14" stroke-width="8"/>
    </g>
    <path d="M122 57h22" fill="none" stroke="url(#warm)" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="96" y="170" fill="#f3f1ee" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="47" font-weight="600" letter-spacing="1">让每个项目的 Agent，各有自己的终端。</text>
  <text x="99" y="215" fill="#a8afb9" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="20">一个窗口管理多个项目与会话。切换视图，任务继续运行。</text>
  <g font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="16" fill="#d6c3b6">
    <rect x="1048" y="91" width="125" height="37" rx="18.5" fill="#d9a17a" fill-opacity=".11" stroke="#d9a17a" stroke-opacity=".25"/>
    <text x="1111" y="115" text-anchor="middle">多项目</text>
    <rect x="1185" y="91" width="125" height="37" rx="18.5" fill="#d9a17a" fill-opacity=".11" stroke="#d9a17a" stroke-opacity=".25"/>
    <text x="1247" y="115" text-anchor="middle">独立终端</text>
    <rect x="1322" y="91" width="153" height="37" rx="18.5" fill="#d9a17a" fill-opacity=".11" stroke="#d9a17a" stroke-opacity=".25"/>
    <text x="1398" y="115" text-anchor="middle">切换不中断</text>
  </g>

  <rect x="92" y="274" width="1416" height="556" rx="19" fill="#1d2025" stroke="#42464d" stroke-width="2" filter="url(#shadow)"/>
  <g clip-path="url(#window-clip)">
    <rect x="93" y="275" width="1414" height="52" fill="url(#surface)"/>
    <rect x="93" y="327" width="302" height="502" fill="#191b1f"/>
    <rect x="395" y="327" width="1112" height="502" fill="#1e2024"/>
    <path d="M93 327h1414M395 327v502" stroke="#34383f" stroke-width="1.5"/>
    <g>
      <circle cx="122" cy="301" r="6.5" fill="#d8887d"/>
      <circle cx="145" cy="301" r="6.5" fill="#d8bb7d"/>
      <circle cx="168" cy="301" r="6.5" fill="#8eae8f"/>
      <text x="799" y="308" text-anchor="middle" fill="#bfc4ca" font-family="Arial,sans-serif" font-size="17" font-weight="600">Two</text>
      <text x="1472" y="307" text-anchor="end" fill="#737b85" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">AGENT TERMINAL WORKSPACE</text>
    </g>

    <g font-family="PingFang SC,Heiti SC,Arial,sans-serif">
      <text x="122" y="372" fill="#9299a4" font-size="15" font-weight="600">项目</text>
      <text x="160" y="372" fill="#6d7580" font-size="14">2</text>
      <rect x="354" y="349" width="25" height="25" rx="6" fill="#2a2d33"/>
      <path d="M361 361.5h11M366.5 356v11" stroke="#bec5cc" stroke-width="1.7" stroke-linecap="round"/>

      <path d="m124 418 5 5 5-5" fill="none" stroke="#9ca4ae" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M150 417h9l3 3h12v11h-24z" fill="none" stroke="#a7afb9" stroke-width="1.7" stroke-linejoin="round"/>
      <text x="183" y="429" fill="#e2e4e7" font-size="18" font-weight="600">tow</text>
      <text x="371" y="426" text-anchor="end" fill="#7c858f" font-size="20">···</text>
      <text x="151" y="455" fill="#a1b8d0" font-size="12">1 个工作中</text>
      <text x="244" y="455" fill="#a8c0ad" font-size="12">1 个完成未读</text>
      <text x="150" y="480" fill="#747e89" font-family="Menlo,Consolas,monospace" font-size="12">~/project/tow</text>
      <path d="M147 494v188" stroke="#363c43" stroke-width="1.5"/>

      <rect x="159" y="507" width="218" height="63" rx="8" fill="#2c3036"/>
      <rect x="159" y="523" width="3" height="30" rx="1.5" fill="#d9a17a"/>
      <text x="177" y="532" fill="#d9a17a" font-family="Menlo,Consolas,monospace" font-size="17">›_</text>
      <text x="208" y="532" fill="#f0efed" font-size="15">修复状态刷新</text>
      <text x="208" y="552" fill="#8fa6bd" font-size="12">codex  ·  ● 工作中</text>

      <text x="177" y="602" fill="#9da5af" font-family="Menlo,Consolas,monospace" font-size="17">›_</text>
      <text x="208" y="602" fill="#c6ccd2" font-size="15">检查构建</text>
      <text x="208" y="622" fill="#9fbca8" font-size="12">codex  ·  ✓ 完成</text>
      <circle cx="364" cy="598" r="3.3" fill="#9fbca8"/>

      <path d="m124 715 5-5-5-5" fill="none" stroke="#8e97a2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M150 704h9l3 3h12v11h-24z" fill="none" stroke="#a7afb9" stroke-width="1.7" stroke-linejoin="round"/>
      <text x="183" y="717" fill="#d1d6db" font-size="18" font-weight="600">website</text>
      <text x="122" y="804" fill="#717b86" font-size="13">项目和会话各自保持运行</text>
    </g>

    <g font-family="PingFang SC,Heiti SC,Arial,sans-serif">
      <text x="429" y="371" fill="#989fa9" font-size="15">tow</text>
      <text x="462" y="371" fill="#5f6873" font-size="15">/</text>
      <text x="478" y="371" fill="#e3e5e8" font-size="16" font-weight="600">修复状态刷新</text>
      <circle cx="1381" cy="365" r="4.5" fill="#9cb9d6"/>
      <text x="1394" y="370" fill="#a7bfd8" font-size="13">工作中</text>
      <path d="M429 389h1038" stroke="#34383e" stroke-width="1.5"/>
    </g>

    <g font-family="Menlo,Consolas,monospace">
      <text x="434" y="434" fill="#dda780" font-size="16">›_</text>
      <text x="467" y="434" fill="#d9dde3" font-size="16" font-weight="600">codex</text>
      <text x="530" y="434" fill="#78818d" font-size="14">/  ~/project/tow</text>
      <text x="434" y="475" fill="#dda780" font-size="15">›</text>
      <text x="463" y="475" fill="#d3d7de" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="15">检查 amd64 会话在后台完成后的状态更新</text>
      <text x="463" y="523" fill="#8eb7a0" font-size="14">✓</text>
      <text x="488" y="523" fill="#b6bdc6" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="14">已定位当前终端的 Hook 接入路径</text>
      <path d="M470 541v64" stroke="#40474f" stroke-width="1.4"/>
      <text x="490" y="564" fill="#8893a0" font-size="13">Read  src-tauri/src/lib.rs</text>
      <text x="490" y="589" fill="#8893a0" font-size="13">Check  UserPromptSubmit / Stop</text>
      <text x="464" y="651" fill="#d9a17a" font-size="18">✳</text>
      <text x="490" y="650" fill="#bbc7d2" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="14">任务继续运行，可随时切换会话</text>
    </g>

    <rect x="429" y="714" width="1038" height="70" rx="9" fill="#272b31" stroke="#3b4149" stroke-width="1.3"/>
    <text x="451" y="757" fill="#dda780" font-family="Menlo,Consolas,monospace" font-size="18">›</text>
    <text x="479" y="757" fill="#7f8996" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="14">Ask Codex to do anything</text>
    <path d="M429 798h1038" stroke="#34383e" stroke-width="1"/>
    <text x="432" y="817" fill="#7b8590" font-family="Menlo,Consolas,monospace" font-size="11">~/project/tow</text>
  </g>

  <text x="100" y="867" fill="#7d8792" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="13">界面示意 · 终端输出为演示内容，实际状态以 CLI 事件和进程为准</text>
  <text x="1499" y="867" text-anchor="end" fill="#7d8792" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">TWO / 2026</text>
</svg>
