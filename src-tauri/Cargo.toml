[package]
name = "agent-workspace"
version = "0.1.0"
description = "A small local workspace for parallel Codex terminals"
edition = "2021"

[lib]
name = "agent_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
atomicwrites = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
